name: Run Image Pipeline
on:
  workflow_dispatch:
env:
  PROJECT_NAME: "RunUnrealBuildServerImagePipeline"
  BUILD_IMAGE_STACK_NAME: "UnrealBuildServerImage"
  IAM_ROLE: "arn:aws:iam::932297900301:role/UnrealBuildServerImageBuilderRole"
permissions:
  id-token: write
  contents: read
jobs:
  DeployStack:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ap-southeast-2
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Get stack name
        id: get-stack-name
        run: |
          aws cloudformation describe-stacks --stack-name ${{ env.BUILD_IMAGE_STACK_NAME }} --query "Stacks[0].Outputs[?OutputKey=='ImageBuilderPipelineArn'].OutputValue" --output text
      - name: Start Image Pipeline Execution
        run: |
          aws imagebuilder start-image-pipeline-execution --image-pipeline-arn ${{ steps.deploy.outputs.PipelineArn }}