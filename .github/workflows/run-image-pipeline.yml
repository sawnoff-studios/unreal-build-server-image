name: Run Image Build Pipeline

on:
  workflow_dispatch:

env:
  PROJECT_NAME: "RunUnrealBuildServerImagePipeline"
  AWS_REGION: "ap-southeast-2"
  BUILD_IMAGE_STACK_NAME: "UnrealBuildServerImageStack"

permissions:
  id-token: write
  contents: read

jobs:
  RunImagePipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Get pipeline ARN
        id: get-pipeline-arn
        run: |
          IMAGE_STACK_PIPELINE_ARN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.BUILD_IMAGE_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ImageBuilderPipelineArn'].OutputValue" \
            --output text)
          
          echo "PIPELINE_ARN=$IMAGE_STACK_PIPELINE_ARN" >> $GITHUB_OUTPUT

      - name: Start pipeline execution
        id: start-pipeline-execution
        run: |
          aws imagebuilder start-image-pipeline-execution --image-pipeline-arn ${{ steps.get-pipeline-arn.outputs.PIPELINE_ARN }}

      - name: Update AMI ID in Secrets Manager
        run: |
          AMI_ID_KEY_SECRET_ARN=$(aws cloudformation describe-stacks \
          --stack-name ${{ env.BUILD_IMAGE_STACK_NAME }} \
          --query "Stacks[0].Outputs[?OutputKey=='AmiIdKeySecretArn'].OutputValue" \
          --output text)
          
          AMI_ID=$(aws imagebuilder get-image \
            --image-build-version-arn ${{ steps.start-pipeline-execution.outputs.IMAGE_BUILD_VERSION_ARN }} \
            --query "image.imageArn" \
            --output text)

          aws secretsmanager put-secret-value \
            --secret-id $AMI_ID_KEY_SECRET_ARN \
            --secret-string "{\"AMI_ID\":\"$AMI_ID\"}"