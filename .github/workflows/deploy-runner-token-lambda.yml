name: Deploy Runner Token Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runner-token-lambda-infra.yml"
      - "runner-token/**"
      - "allow-ec2-invoke-lambda-infra.yml"

env:
  PROJECT_NAME: "UnrealBuildServerRunnerTokenLambda"
  AWS_REGION: "ap-southeast-2"
  LAMBDA_ZIP_FILE_PATH: "./lambda.zip"
  GITHUB_ORG: "sawnoff-studios"
  GITHUB_SECRET_NAME: "/github/actions/runner-key"

permissions:
  id-token: write
  contents: read

jobs:
  DeployStack:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Clone repository
        uses: actions/checkout@v7

      - name: Zip up Lambda
        run: zip -r ${{ env.LAMBDA_ZIP_FILE_PATH }} runner-token

      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        id: deploy
        with:
          name: ${{ env.PROJECT_NAME }}Stack
          template: ${{ github.workspace }}/runner-token-lambda-infra.yml
          parameter-overrides: "LambdaZipFilePath=${{ env.LAMBDA_ZIP_FILE_PATH }},GitHubOrganization=${{ env.GITHUB_ORG }},GitHubSecretName=${{ env.GITHUB_SECRET_NAME }},SecretAppId=${{ secrets.LAMBDA_APP_ID }},InstallationId=${{ secrets.LAMBDA_APP_INSTALLATION_ID }},PrivateKey=${{ secrets.LAMBDA_APP_PRIVATE_KEY }}"