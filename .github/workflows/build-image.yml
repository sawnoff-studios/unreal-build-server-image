name: Build Image
on:
  push:
    branches:
      - main
env:
  PROJECT_NAME: "UnrealBuildServerImage"
  IAM_ROLE: "arn:aws:iam::932297900301:role/UnrealBuildServerImageBuilderRole"
  LOG_BUCKET_NAME: "unreal-build-server-image-logs"
  INSTANCE_TYPE: "t3.medium"
permissions:
  id-token: write
  contents: read
jobs:
  DeployStack:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ap-southeast-2
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        id: deploy
        with:
          name: ${{ env.PROJECT_NAME }}Stack
          template: ${{ github.workspace }}/image-build.yml
          parameter-overrides: "InstanceType=${{ env.INSTANCE_TYPE }},LogBucketName=${{ env.LOG_BUCKET_NAME }}"
          capabilities: 'CAPABILITY_NAMED_IAM'
#      - name: Start Build Pipeline
#        run: |
#          aws imagebuilder start-image-pipeline-execution --image-pipeline-arn ${{ steps.deploy.outputs.PipelineArn }}