name: Create Log Bucket
on:
  workflow_dispatch:
env:
  PROJECT_NAME: "UnrealBuildServerImageLogBucket"
  LOG_BUCKET_NAME: "unreal-build-server-image-logs"
permissions:
  id-token: write
  contents: read
jobs:
  DeployStack:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ap-southeast-2
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        id: deploy
        with:
          name: ${{ env.PROJECT_NAME }}Stack
          template: ${{ github.workspace }}/create-log-bucket.yml
          parameter-overrides: "LogBucketName=${{ env.LOG_BUCKET_NAME }}"