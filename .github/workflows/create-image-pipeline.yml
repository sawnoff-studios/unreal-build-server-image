name: Create Image Build Pipeline
on:
  push:
    branches:
      - main
    paths:
      - create-image-pipeline.yml
env:
  PROJECT_NAME: "UnrealBuildServerImage"
  IAM_ROLE: "arn:aws:iam::932297900301:role/UnrealBuildServerImageBuilderRole"
  LOG_BUCKET_NAME: "unreal-build-server-image-logs"
  SNS_TOPIC_ARN: "arn:aws:sns:ap-southeast-2:932297900301:UnrealBuildServerImage"
  INSTANCE_TYPE: "m5.xlarge"
permissions:
  id-token: write
  contents: read
jobs:
  DeployStack:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}
          aws-region: ap-southeast-2
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Remove existing CloudFormation stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}Stack
          aws cloudformation wait stack-delete-complete --stack-name ${{ env.PROJECT_NAME }}Stack
      - name: Deploy CloudFormation stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        id: deploy
        with:
          name: ${{ env.PROJECT_NAME }}Stack
          template: ${{ github.workspace }}/image-pipeline-infra.yml
          parameter-overrides: "InstanceType=${{ env.INSTANCE_TYPE }},LogBucketName=${{ env.LOG_BUCKET_NAME }},SnsTopicArn=${{ env.SNS_TOPIC_ARN }}"
          capabilities: 'CAPABILITY_NAMED_IAM'