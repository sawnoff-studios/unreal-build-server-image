Parameters:
  InstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type used during image build

  LogBucketName:
    Type: String
    Description: Name of the S3 bucket for image builder logs

  FilesBucketName:
    Type: String
    Description: Name of the S3 bucket for Unreal Engine files

  SnsTopicArn:
    Type: String
    Description: SNS topic ARN for notifications

  RunnerTokenLambdaArn:
    Type: String
    Description: ARN of the Lambda function that retrieves GitHub self-hosted runner tokens

  UnrealMajorVersion:
    Type: String
    Default: 5
    Description: Unreal Engine major version

  UnrealMinorVersion:
    Type: String
    Default: 6
    Description: Unreal Engine minor version

Resources:
  # EC2 instance role
  # By default, AWS Services do not have permission to perform actions on your instances. This grants
  # AWS Systems Manager (SSM) and EC2 Image Builder the necessary permissions to build an image.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-iam-role.html
  # https://docs.aws.amazon.com/imagebuilder/latest/userguide/image-builder-setting-up.html
  InstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      Comment: Role to be used by instance during image build.
    Properties:
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/EC2InstanceProfileForImageBuilder
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - !Sub 'ec2.${AWS::URLSuffix}'
      Path: /executionServiceEC2Role/


  # EC2 instance role logging policy
  # Policy to allow the instance to write to the S3 bucket (via instance role / instance profile).
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-iam-policy.html
  InstanceRoleLoggingPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      Comment: Allows the instance to save log files to an S3 bucket.
    Properties:
      PolicyName: ImageBuilderLogBucketPolicy
      Roles:
        - Ref: InstanceRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - s3:PutObject
            Effect: Allow
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${LogBucketName}/*


  # EC2 instance role files bucket policy
  # Policy to allow the instance to download Unreal Engine files
  InstanceFilesBucketPolicy:
    Type: AWS::IAM::Policy
    Metadata:
      Comment: Allows the instance to download files from an S3 bucket.
    Properties:
      PolicyName: ImageBuilderFilesBucketPolicy
      Roles:
        - Ref: InstanceRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - s3:GetObject
            Effect: Allow
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:s3:::${FilesBucketName}/*


  # EC2 instance profile
  # To pass the InstanceRole to an EC2 instance, we need an InstanceProfile.
  # This profile will be used during the image build process.
  # https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: UnrealBuildServerImageInstanceProfile
      Roles:
        - Ref: InstanceRole


  # Build instance configuration
  # Specifies the infrastructure within which to build and test your image.
  # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-imagebuilder-infrastructureconfiguration.html
  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name:
        Fn::Sub:
          WindowsServer2025-Unreal-Engine-${UnrealMajorVersion}-${UnrealMinorVersion}-BuildInfrastructure
      InstanceTypes:
        - !Ref InstanceType
      InstanceProfileName:
        Ref: InstanceProfile
      SnsTopicArn: !Ref SnsTopicArn
      # Specify an S3 bucket and EC2 Image Builder will save logs to the bucket.
      Logging:
        S3Logs:
          S3BucketName: !Ref LogBucketName
#           S3KeyPrefix: 'my-imagebuilder-bucket-prefix'
      # If you would like to keep the instance running after a failed build, set TerminateInstanceOnFailure to false.
      # TerminateInstanceOnFailure: false
      # If you do not have a default VPC or want to use a different VPC, you must specify the subnet ID to use
      # SubnetId: 'subnet-id'


  # Custom component to install CloudWatch Agent
  CloudWatchAgentComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-CloudWatch-Agent
      Version: 1.0.0
      Description: Install Amazon CloudWatch Agent for Windows
      Platform: Windows
      Data: |
        name: Install CloudWatch Agent
        description: Installs Amazon CloudWatch Agent using the official installer
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: DownloadCloudWatchAgent
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $url = "https://s3.amazonaws.com/amazoncloudwatch-agent/windows/amd64/latest/amazon-cloudwatch-agent.msi"
                      $installer = "C:\Windows\Temp\amazon-cloudwatch-agent.msi"
                      Invoke-WebRequest `
                        -Uri $url `
                        -OutFile $installer

              - name: InstallCloudWatchAgent
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      Start-Process `
                        -FilePath "msiexec.exe" `
                        -ArgumentList "/i C:\Windows\Temp\amazon-cloudwatch-agent.msi /qn /norestart" `
                        -Wait

              - name: VerifyCloudWatchAgent
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $agentPath = "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.exe"
                      if (!(Test-Path $agentPath)) {
                        throw "CloudWatch Agent not found at $agentPath"
                      }
                      Write-Host "CloudWatch Agent installed successfully"


  # Custom component to install 7Zip
  7ZipComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-7Zip
      Version: 1.0.0
      Description: Install 7-Zip for Windows
      Platform: Windows
      Data: |
        name: Install 7-Zip for Windows
        description: Installs 7-Zip using the official installer
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: Download7Zip
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $url = "https://www.7-zip.org/a/7z2408-x64.exe"
                      $installer = "C:\Windows\Temp\7ZipInstaller.exe"
                      Invoke-WebRequest `
                        -Uri $url `
                        -OutFile $installer

              - name: Install7Zip
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      Start-Process `
                        -FilePath "C:\Windows\Temp\7ZipInstaller.exe" `
                        -ArgumentList "/S" `
                        -Wait

              - name: Verify7Zip
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $7zipPath = "C:\Program Files\7-Zip\7z.exe"
                      if (!(Test-Path $7zipPath)) {
                        throw "7-Zip not found at $7zipPath"
                      }
                      Write-Host "7-Zip installed successfully"
  
  
  # Custom component to install Git
  GitComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-Git
      Version: 1.0.0
      Description: Install Git for Windows
      Platform: Windows
      Data: |
        name: Install Git for Windows
        description: Installs Git using the official Git for Windows installer
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: DownloadGit
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $url = "https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.2/Git-2.55.0.2-64-bit.exe"
                      $installer = "C:\Windows\Temp\GitInstaller.exe"
                      Invoke-WebRequest `
                        -Uri $url `
                        -OutFile $installer

              - name: InstallGit
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      Start-Process `
                        -FilePath "C:\Windows\Temp\GitInstaller.exe" `
                        -ArgumentList "/VERYSILENT /NORESTART" `
                        -Wait

              - name: VerifyGit
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      git --version


  # Custom component to install Git LFS
  GitLfsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-Git-LFS
      Version: 1.0.0
      Description: Install Git LFS for Windows
      Platform: Windows
      Data: |
        name: Install Git for Windows
        description: Installs Git LFS using the official Git LFS for Windows installer
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: DownloadGitLfs
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $url = "https://github.com/git-lfs/git-lfs/releases/download/v3.4.0/git-lfs-windows-v3.4.0.exe"
                      $installer = "C:\Windows\Temp\GitLfsInstaller.exe"
                      Invoke-WebRequest `
                        -Uri $url `
                        -OutFile $installer

              - name: InstallGitLfs
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      Start-Process `
                        -FilePath "C:\Windows\Temp\GitLfsInstaller.exe" `
                        -ArgumentList "/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
                        -Wait

              - name: VerifyGitLfs
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      git lfs --version
        
              - name: ConfigureGitLfs
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      git config --global lfs.concurrenttransfers 64


  # GitHub Actions Runner component
  GitHubActionsRunnerComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-GitHub-Actions-Runner
      Description: Installs the GitHub Actions runner on Windows
      Platform: Windows
      Version: '1.0.0'
      Data: |
        name: Install-GitHub-Actions-Runner
        description: Installs GitHub Actions runner binaries
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: DownloadAndExtractRunner
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      # Create a folder under the drive root
                      New-Item -ItemType Directory -Path C:\actions-runner -Force
                      Set-Location C:\actions-runner

                      # Download the latest runner package
                      Invoke-WebRequest `
                        -Uri https://github.com/actions/runner/releases/download/v2.335.1/actions-runner-win-x64-2.335.1.zip `
                        -OutFile actions-runner.zip

                      # Validate the hash
                      if ((Get-FileHash `
                        -Path actions-runner.zip `
                        -Algorithm SHA256).Hash.ToUpper() `
                        -ne 'EB65C95277AF42BCF3778A799C41359D224BA2A67B4DE26B7CEA1729B09C803D') {
                          throw 'Computed checksum did not match'
                      }

                      # Extract the installer
                      Add-Type -AssemblyName System.IO.Compression.FileSystem

                      [System.IO.Compression.ZipFile]::ExtractToDirectory(
                        "C:\actions-runner\actions-runner.zip",
                        "C:\actions-runner"
                      )
  

  # Custom component to install Unreal Engine
  UnrealEngineComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-Unreal-Engine
      Description: Installs Unreal Engine
      Platform: Windows
      Version: 1.0.0
      ChangeDescription: Initial Unreal Engine component

      Data: |
        name: Install Unreal Engine
        description: Downloads and extracts Unreal Engine
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: DownloadUnrealEngine
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $ErrorActionPreference = "Stop"
                      $ZipFilePath = "C:\Windows\Temp\UnrealEngine.zip"
        
                      Write-Host "Downloading Unreal Engine binaries..."
                      Read-S3Object -BucketName unreal-build-server-files -Key UE_5.5.zip -File $ZipFilePath
        
                      if (!(Test-Path $ZipFilePath)) {
                        throw "Unreal Engine download failed"
                      }
        
              - name: ExtractUnrealEngine
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $ErrorActionPreference = "Stop"
                      $7ZipExePath = "C:\Program Files\7-Zip\7z.exe"
                      $ZipFilePath = "C:\Windows\Temp\UnrealEngine.zip"

                      Write-Host "Extracting Unreal Engine binaries..."
                      & $7ZipExePath x -o"C:\Program Files\Epic Games\" $ZipFilePath -y
                      Remove-Item -Path $ZipFilePath -Force
        
              - name: VerifyUnrealEngine
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $ErrorActionPreference = "Stop"
                      $UnrealPath = "C:\Program Files\Epic Games\UE_5.5\"

                      Write-Host "Verifying Unreal Engine extraction..."

                      if (!(Test-Path $UnrealPath)) {
                          throw "Unreal Engine directory not found at $UnrealPath"
                      }

                      $RunUatBatch = Join-Path $UnrealPath "\Engine\Build\BatchFiles\RunUAT.bat"
        
                      if (!(Test-Path $RunUatBatch)) {
                          throw "RunUAT.bat not found - extraction may have failed"
                      }

                      Write-Host "Unreal Engine verified successfully at $UnrealPath"
        

  # Custom component to install Visual Studio 2022 Community Edition
  VisualStudioComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Install-VisualStudio-2022-Community
      Platform: Windows
      Version: 1.0.0
      Description: Installs Visual Studio 2022 Community Edition
      Data: |
        name: Install Visual Studio 2022 Community
        description: Downloads and installs Visual Studio 2022 Community
        schemaVersion: 1.0

        phases:
          - name: build
            steps:
              - name: InstallVisualStudio
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $ErrorActionPreference = "Stop"

                      $InstallerPath = "C:\Windows\Temp\vs_community.exe"

                      Write-Host "Downloading Visual Studio Community installer..."

                      Invoke-WebRequest `
                        -Uri "https://aka.ms/vs/17/release/vs_community.exe" `
                        -OutFile $InstallerPath

                      Write-Host "Installing Visual Studio..."

                      $process = Start-Process `
                        -FilePath $InstallerPath `
                        -ArgumentList @(
                          "--quiet",
                          "--wait",
                          "--norestart",
                          "--nocache",
                          "--add",
                          "Microsoft.VisualStudio.Workload.NativeGame",
                          "--add",
                          "Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64",
                          "--add",
                          "Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64",
                          "--add",
                          "Microsoft.VisualStudio.Component.VC.14.38.17.8.x86.x64.Spectre",
                          "--add",
                          "Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64.Spectre",
                          "--includeRecommended"
                        ) `
                        -Wait `
                        -PassThru

                      $exitCode = $process.ExitCode
                      Write-Host "Visual Studio installer exited with code: $exitCode"
        
                      if ($exitCode -ne 0) {
                        throw "Visual Studio installation failed with exit code $exitCode"
                      }
        
                      if ($exitCode -eq 3010) {
                        Write-Host "Visual Studio installation requires a reboot (exit code 3010). Continuing."
                      }

                      Write-Host "Cleaning up installer..."

                      Remove-Item `
                        -Path $InstallerPath `
                        -Force

                      Write-Host "Visual Studio installation complete."
        
              - name: VerifyVisualStudio
                action: ExecutePowerShell
                inputs:
                  commands:
                    - |
                      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                      $installPath = & $vswhere -latest -property installationPath
                      if (-not $installPath) {
                        throw "Visual Studio not detected"
                      }
                      Write-Host "Visual Studio installed at: $installPath"


  # Windows Server 2025 base image
  ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name:
        Fn::Sub:
          WindowsServer2025-Unreal-Engine-${UnrealMajorVersion}-${UnrealMinorVersion}
      Version: 1.0.0
      # ${AWS::Partition} returns the partition where you are running the CloudFormation template. For standard AWS regions, the
      # partition is aws. For resources elsewhere, the partition is aws-partitionname. For example, China (Beijing and Ningxia)
      # regions use aws-cn and AWS GovCloud (US) regions are aws-us-gov.
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/pseudo-parameter-reference.html
      ParentImage:
        Fn::Sub:
          arn:${AWS::Partition}:imagebuilder:${AWS::Region}:aws:image/windows-server-2025-english-full-base-x86/x.x.x
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 250
            VolumeType: gp3
      Components:
        - ComponentArn: !Ref CloudWatchAgentComponent
        - ComponentArn: !Ref 7ZipComponent
        - ComponentArn: !Ref GitComponent
        - ComponentArn: !Ref GitLfsComponent
        - ComponentArn: !Ref GitHubActionsRunnerComponent
        - ComponentArn: !Ref UnrealEngineComponent
        - ComponentArn: !Ref VisualStudioComponent
      AdditionalInstanceConfiguration:
        UserDataOverride:
          Fn::Base64: !Sub |
            <powershell>
            
            $runnerDir="C:\actions-runner"
            
            cd $runnerDir
            
            Write-Host "Invoking Lambda..."
            
            $payload = "{}"
            
            $response = aws lambda invoke `
                --function-name ${RunnerTokenLambdaArn} `
                --payload $payload `
                C:\token.json
            
            $tokenObject = Get-Content C:\token.json | ConvertFrom-Json
            
            $token = $tokenObject.token
            $repoUrl = $tokenObject.url
            
            Write-Host "Configuring Runner"
            
            .\config.cmd `
               --unattended `
               --url $repoUrl `
               --token $token `
               --name $env:COMPUTERNAME `
               --replace `
               --runasservice
            
            .\run.cmd
            
            </powershell>

  # AMI distribution
  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name:
        Fn::Sub:
          WindowsServer2025-Unreal-Engine-${UnrealMajorVersion}-${UnrealMinorVersion}
      Distributions:
        - Region:
            Ref: AWS::Region
          AmiDistributionConfiguration:
            Name:
              Fn::Sub:
                WindowsServer2025-Unreal-Engine-${UnrealMajorVersion}-${UnrealMinorVersion}-{{imagebuilder:buildDate}}
            Description:
              Fn::Sub:
                Windows Server 2025 with Unreal Engine ${UnrealMajorVersion}.${UnrealMinorVersion} installed


  # Image pipeline
  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name:
        Fn::Sub:
          WindowsServer2025-Unreal-Engine-${UnrealMajorVersion}-${UnrealMinorVersion}-Pipeline
      ImageRecipeArn:
        Ref: ImageRecipe
      InfrastructureConfigurationArn:
        Ref: InfrastructureConfiguration
      DistributionConfigurationArn:
        Ref: DistributionConfiguration
      Status:
        ENABLED


Outputs:
  ImageBuilderPipelineArn:
    Description: Image Builder Pipeline ARN
    Value:
      Ref: ImagePipeline